name: CI
on:
  push:
    branches: [main]
jobs:
  # Linux runner: analyze + test once (both are OS-independent) and compile a
  # release APK to catch release-only breakage. Debug-signed via the build.gradle
  # fallback (ALLOW_DEBUG_SIGNED_RELEASE) — no signing secrets needed.
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Match the JDK the release workflows build with, so this compile check
      # faithfully catches what would break a real release.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter doctor -v
      - run: flutter pub get
      # Fail if committed generated files (*.g.dart) are stale — CI never runs
      # build_runner otherwise, so forgetting to regenerate after editing a MobX
      # store or @JsonSerializable model slips past analyze/test/build.
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::Generated files are out of date. Run `dart run build_runner build --delete-conflicting-outputs` and commit the result.'
            git status --porcelain
            git diff
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release --dart-define CLIENT_ID=$CLIENT_ID --dart-define SECRET=$SECRET
        env:
          ALLOW_DEBUG_SIGNED_RELEASE: '1'
          # CI only checks compilation; real credentials are required by the
          # GitHub release workflow below.
          CLIENT_ID: ci-placeholder-client-id
          SECRET: ci-placeholder-client-secret
  # macOS runner: release-compile iOS (no codesign, no secrets) — the only thing
  # that must run on macOS. analyze/test already covered on the Linux job.
  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # Match release workflows and avoid GitHub's lagging default Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
