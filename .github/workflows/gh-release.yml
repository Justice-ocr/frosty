# Drafts a GitHub release with the APK attached.
name: Draft GitHub release
on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

# Forks need an explicit write scope for the workflow token to create and
# update GitHub Releases with the APK artifact.
permissions:
  contents: write

jobs:
  android:
    name: Draft release and attach APK
    runs-on: ubuntu-latest
    environment: release-android
    env:
      UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_FILE_PATH: android/key.properties
      # Client IDs are public, so forks may provide one as a repository
      # variable; keep the secret form compatible with upstream.
      CLIENT_ID: ${{ secrets.CLIENT_ID || vars.CLIENT_ID }}
      SECRET: ${{ secrets.SECRET }}
    steps:
      - name: Checkout Frosty repo
        uses: actions/checkout@v6
      
      # Setup Java so that we can build the APK.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      
      # Setup and cache Flutter to install packages and build.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      
      # Decode the upload key when the fork has a valid one. Forks without the
      # upstream signing secret fall back to the debug key so GitHub Releases
      # still provide an installable APK.
      - name: Decode and create upload-keystore.jks
        run: |
          set +e
          if [ -n "$UPLOAD_KEYSTORE" ]; then
            printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"
            keytool -list -keystore "$GITHUB_WORKSPACE/android/upload-keystore.jks" \
              -storepass "$STORE_PASSWORD" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "UPLOAD_KEYSTORE_VALID=true" >> "$GITHUB_ENV"
            else
              rm -f "$GITHUB_WORKSPACE/android/upload-keystore.jks"
            fi
          fi
          if [ "$UPLOAD_KEYSTORE_VALID" != "true" ]; then
            echo "ALLOW_DEBUG_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "No valid upload keystore was provided; using debug signing for the GitHub APK."
          fi

      # Create the key.properties file, used for signing the app.
      - name: Create key.properties
        run: |
          if [ "$UPLOAD_KEYSTORE_VALID" = "true" ]; then
            echo storePassword=$STORE_PASSWORD >> $KEY_FILE_PATH
            echo keyPassword=$KEY_PASSWORD >> $KEY_FILE_PATH
            echo keyAlias=upload >> $KEY_FILE_PATH
            echo storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks >> $KEY_FILE_PATH
          fi

      # workflow_dispatch runs on a branch, so derive a stable release tag
      # from pubspec.yaml instead of using github.ref_name (for example main).
      - name: Determine release tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(sed -n 's/^version: *\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
            if [ -z "$VERSION" ]; then
              echo "::error::Unable to read version from pubspec.yaml"
              exit 1
            fi
            RELEASE_TAG="v${VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Using release tag: $RELEASE_TAG"
      
      # Build the APK with the environment variables and move/rename it.
      - name: Build for Android
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Missing Twitch CLIENT_ID. Add CLIENT_ID as a repository/environment secret or variable before building a release."
            exit 1
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::Missing Twitch SECRET. Add SECRET as a repository/environment secret before building a release."
            exit 1
          fi
          flutter build apk --dart-define CLIENT_ID=$CLIENT_ID --dart-define SECRET=$SECRET
          mv build/app/outputs/flutter-apk/app-release.apk frosty-${RELEASE_TAG}.apk

      # Extract release notes from assets/release-notes.md for the current version.
      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="$RELEASE_TAG"
          RELEASE_NOTES_FILE="assets/release-notes.md"

          # Extract the section for this version using awk
          # Starts at "## vX.X.X", skips date line, stops at next "---" or "## v" header
          NOTES=$(awk -v version="$VERSION" '
            BEGIN { found=0; output="" }
            $0 ~ "^## " version "$" { found=1; next }
            found && /^[A-Z][a-z]+ [0-9]+, [0-9]+$/ { next }
            found && /^---$/ { exit }
            found && /^## v[0-9]+\.[0-9]+\.[0-9]+$/ { exit }
            found { output = output $0 "\n" }
            END { print output }
          ' "$RELEASE_NOTES_FILE")

          # Clean up "on GitHub" suffix (redundant since we're on GitHub)
          NOTES=$(echo "$NOTES" | sed 's/ on GitHub)/)/')

          # Trim leading/trailing whitespace
          NOTES=$(echo "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -n "$NOTES" ]; then
            # Get the previous tag for the Full Changelog link
            PREV_TAG=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || echo "")

            echo "found=true" >> $GITHUB_OUTPUT
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            if [ -n "$PREV_TAG" ]; then
              echo "" >> $GITHUB_OUTPUT
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}" >> $GITHUB_OUTPUT
            fi
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::No release notes found for $VERSION in $RELEASE_NOTES_FILE"
          fi

      # Create a draft release on GitHub.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}
          # Fork tokens may not have the generate-release-notes permission.
          # Always provide an explicit body instead of calling that API.
          generate_release_notes: false
          body: ${{ steps.release_notes.outputs.found == 'true' && steps.release_notes.outputs.body || format('Frosty fork release {0}.', env.RELEASE_TAG) }}
          files: frosty-${{ env.RELEASE_TAG }}.apk
